name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: verify the committed matrix is not stale
        run: |
          # Save the committed matrix before regenerating, then compare
          # everything except the two fields that are intentionally
          # non-deterministic (generatedAt, buildId).
          cp src/generated/matrix.json /tmp/matrix-committed.json
          npm run review
          python3 - <<'PY'
          import json, sys
          def strip(o):
              if isinstance(o, dict):
                  return {k: strip(v) for k, v in o.items() if k not in ('generatedAt', 'buildId')}
              if isinstance(o, list):
                  return [strip(x) for x in o]
              return o
          try:
              committed = strip(json.load(open('/tmp/matrix-committed.json')))
              fresh = strip(json.load(open('src/generated/matrix.json')))
              public = strip(json.load(open('public/matrix.json')))
          except Exception as e:
              print(f'Could not compare matrices: {e}')
              sys.exit(2)
          if committed != fresh:
              print('The committed matrix is stale (semantic content differs).')
              print('Run npm run review locally and commit the result.')
              sys.exit(2)
          if fresh != public:
              print('src/generated/matrix.json and public/matrix.json disagree.')
              sys.exit(2)
          print('Matrix is up to date.')
          PY
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: ./dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
